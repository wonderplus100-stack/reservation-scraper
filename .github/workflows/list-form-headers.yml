name: list-form-headers

on:
  workflow_dispatch: {}

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install

      - name: List Google Form response headers
        env:
          FORM_1_SPREADSHEET_ID: ${{ vars.FORM_1_SPREADSHEET_ID }}
          FORM_1_SHEET_NAME: ${{ vars.FORM_1_SHEET_NAME }}
          FORM_2_SPREADSHEET_ID: ${{ vars.FORM_2_SPREADSHEET_ID }}
          FORM_2_SHEET_NAME: ${{ vars.FORM_2_SHEET_NAME }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/list-form-headers.mjs
